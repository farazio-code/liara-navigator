openapi: 3.1.0
info:
  title: Liara Navigator MVP API
  version: 2.0.0
  description: >-
    Same-origin API for the bounded Agentic and mock Support Ticket workflows.
    No personal Liara token is accepted. Resource references are session-scoped,
    logs are bounded and sanitized before model use, and ticket submission is mocked.
servers:
  - url: /api/v1
paths:
  /sessions:
    post:
      operationId: createAnonymousSession
      responses:
        '201':
          description: Anonymous session and memory-only CSRF token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
  /fake-liara/platforms:
    get:
      operationId: listPlatforms
      responses:
        '200':
          description: Supported PaaS platforms
  /fake-liara/apps:
    get:
      operationId: listApps
      parameters:
        - in: query
          name: platform
          required: true
          schema: { $ref: '#/components/schemas/Platform' }
      responses:
        '200':
          description: Session-visible apps with opaque references
  /fake-liara/apps/{app_ref}/services:
    get:
      operationId: listServices
      parameters:
        - $ref: '#/components/parameters/AppRef'
      responses:
        '200':
          description: Services belonging to the selected app
        '404': { $ref: '#/components/responses/ResourceNotAllowed' }
  /fake-liara/services/{service_ref}/logs:
    get:
      operationId: getBoundedFixtureLogs
      parameters:
        - $ref: '#/components/parameters/ServiceRef'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Deterministic fixture logs; production agent sanitizes before model use
        '404': { $ref: '#/components/responses/ResourceNotAllowed' }
  /turns/stream:
    post:
      operationId: streamAgentTurn
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurnRequest' }
      responses:
        '200':
          description: Typed SSE ending in request.completed
          content:
            text/event-stream:
              schema: { type: string }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '409': { description: Idempotency key reused with different input }
        '429': { description: Session turn budget exceeded }
  /tickets:
    post:
      operationId: submitMockTicket
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketRequest' }
      responses:
        '201':
          description: Mock ticket accepted; nothing sent to real support
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: Invalid or secret-bearing content }
  /health/live:
    get:
      operationId: liveness
      responses:
        '200': { description: Process is alive }
components:
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    AppRef:
      in: path
      name: app_ref
      required: true
      schema: { type: string, minLength: 8, maxLength: 80 }
    ServiceRef:
      in: path
      name: service_ref
      required: true
      schema: { type: string, minLength: 8, maxLength: 80 }
  schemas:
    Platform:
      type: string
      enum: [angular, django, docker, dotnet, flask, go, laravel, nextjs, nodejs, php, python, react, static, vue]
    Topic:
      type: string
      enum: [paas, cdn, ssl, dns, other]
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session, csrf_token]
      properties:
        session: { type: object }
        csrf_token: { type: string, minLength: 32, maxLength: 256 }
    TurnRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, topic, message]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 64 }
        topic: { $ref: '#/components/schemas/Topic' }
        message: { type: string, minLength: 4, maxLength: 4000 }
        service_ref: { type: [string, 'null'], minLength: 8, maxLength: 80 }
    TicketRequest:
      type: object
      additionalProperties: false
      required: [topic, subject, description]
      properties:
        topic: { $ref: '#/components/schemas/Topic' }
        subject: { type: string, minLength: 10, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 2000 }
        handoff_summary: { type: [string, 'null'], maxLength: 1500 }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { type: string }
        message: { type: string, maxLength: 240 }
        request_id: { type: string, format: uuid }
        retryable: { type: boolean }
  responses:
    CsrfInvalid:
      description: CSRF validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ResourceNotAllowed:
      description: Reference is missing, wrong-kind, or belongs to another session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
